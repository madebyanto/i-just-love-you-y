<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>per teeeee🩵</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at 30% 20%, #0d3d6b 0%, #061c35 50%, #020d1c 100%);
  font-family: 'Poppins', sans-serif;
  color: #e8f6ff;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.star {
  position: absolute;
  border-radius: 50%;
  background: white;
  animation: twinkle var(--d) ease-in-out infinite;
  animation-delay: var(--dl);
}
@keyframes twinkle {
  0%,100% { opacity: var(--op); }
  50% { opacity: 0.08; }
}

.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 500px;
  padding: 40px 20px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}

.glass {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.12);
  width: 100%;
}

/* INTRO */
.intro {
  text-align: center;
  padding: 40px 28px 32px;
}
.intro .label {
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgba(126,200,240,0.7);
  margin-bottom: 16px;
}
.intro h1 {
  font-family: 'Poppins', sans-serif;
  font-size: clamp(2.4rem, 8vw, 4rem);
  font-weight: 300;
  font-style: italic;
  line-height: 1.15;
  color: #e8f6ff;
}
.intro h1 em { color: #7ec8f0; }
.intro .sub {
  margin-top: 12px;
  font-size: 0.8rem;
  color: rgba(232,246,255,0.4);
  letter-spacing: 0.5px;
}

/* GIOCO */
.game-wrap { padding: 24px 24px 20px; }
.game-hint {
  text-align: center;
  font-family: 'Poppins', sans-serif;
  font-style: italic;
  font-size: 0.95rem;
  color: rgba(232,246,255,0.5);
  margin-bottom: 16px;
  min-height: 22px;
}
.canvas-box {
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(126,200,240,0.12);
  background: rgba(0,0,0,0.22);
  cursor: none;
  position: relative;
}
canvas {
  display: block;
  width: 100%;
  height: 280px;
  touch-action: none;
}
.score-row {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-top: 14px;
}
.s-item {
  text-align: center;
  font-size: 0.7rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(232,246,255,0.35);
}
.s-item strong {
  display: block;
  font-family: 'Poppins', sans-serif;
  font-size: 1.8rem;
  font-weight: 300;
  color: #7ec8f0;
  line-height: 1.1;
}

/* FINALE */
.finale {
  display: none;
  text-align: center;
  padding: 52px 32px 44px;
  animation: popIn 1s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes popIn {
  from { opacity:0; transform:scale(0.88) translateY(16px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
.finale .big {
  font-family: 'Poppins', sans-serif;
  font-size: clamp(3rem, 10vw, 5.5rem);
  font-weight: 300;
  font-style: italic;
  line-height: 1.1;
  color: #e8f6ff;
}
.finale .big em { color: #7ec8f0; }
.heart-pulse {
  display: inline-block;
  margin: 20px 0 0;
  font-size: 2.4rem;
  animation: pulse 1.4s ease-in-out infinite;
  line-height: 1;
}
@keyframes pulse {
  0%,100% { transform:scale(1); }
  14%      { transform:scale(1.35); }
  28%      { transform:scale(1); }
  42%      { transform:scale(1.2); }
  56%      { transform:scale(1); }
}
.finale .caption {
  margin-top: 10px;
  font-size: 0.75rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(232,246,255,0.3);
}
.gif-box {
  margin: 28px auto 0;
  width: 200px;
  height: 160px;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid rgba(126,200,240,0.2);
  background: rgba(126,200,240,0.05);
  display: flex;
  align-items: center;
  justify-content: center;
}
.gif-box img { width:100%; height:100%; object-fit:cover; display:block; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="page">

  <div class="intro glass">
    <div class="label">una cosuccia per te patata!!</div>
    <h1>cattura i<br><em>cuori!!!</em></h1>
    <p class="sub">muovi il mouse (o il dito)</p>
  </div>

  <div class="game-wrap glass" id="gameWrap">
    <p class="game-hint" id="hint">inizia a muoverti per giocare</p>
    <div class="canvas-box">
      <canvas id="c"></canvas>
    </div>
    <div class="score-row">
      <div class="s-item"><strong id="sc">0</strong>presi</div>
      <div class="s-item"><strong id="tm">30</strong>secondi</div>
    </div>
  </div>

  <div class="finale glass" id="finale">
    <div class="big">ti amo<br>bimbaaaa</div>
    <div class="heart-pulse">🩵</div>
    <p class="caption">ce l'hai fatta, brava picciiiiii</p>
    <div class="gif-box" id="gifBox">
      <img src="gifs/us.png" id="mainGif">
    </div>
  </div>

</div>

<script>
// stelle
(()=>{
  const c=document.getElementById('stars');
  for(let i=0;i<110;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()<0.25?2:1;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--dl:${Math.random()*7}s;--op:${0.25+Math.random()*0.75}`;
    c.appendChild(s);
  }
})();

// gioco
(()=>{
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');
  let W=0,H=0,dpr=1;

  function resize(){
    dpr=window.devicePixelRatio||1;
    const r=canvas.getBoundingClientRect();
    W=r.width; H=r.height||280;
    canvas.width=W*dpr; canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  setTimeout(resize,50);
  window.addEventListener('resize',()=>{ resize(); });

  let mx=-999,my=-999,started=false,over=false;
  let score=0,timeLeft=30;
  const hearts=[];
  let spawnT=0,timerInt=null;
  const msgs=['dai vai!🩵','prendili tuttiiii','bravissima','veloce!','ancora!','mwah'];
  let msgT=0;

  function start(){
    if(started||over)return;
    started=true;
    document.getElementById('hint').textContent='dai vai! 🩵';
    timerInt=setInterval(()=>{
      timeLeft--;
      document.getElementById('tm').textContent=timeLeft;
      if(timeLeft<=0){
        clearInterval(timerInt);
        over=true;
        setTimeout(()=>{
          document.getElementById('gameWrap').style.display='none';
          document.getElementById('finale').style.display='block';
        },600);
      }
    },1000);
  }

  function getPos(e){
    const r=canvas.getBoundingClientRect();
    if(e.touches) return {x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  }
  canvas.addEventListener('mousemove',e=>{const p=getPos(e);mx=p.x;my=p.y;start();});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();const p=getPos(e);mx=p.x;my=p.y;start();},{passive:false});
  canvas.addEventListener('touchstart',e=>{e.preventDefault();const p=getPos(e);mx=p.x;my=p.y;start();},{passive:false});

  function spawn(){
    const s=9+Math.random()*14;
    hearts.push({
      x:s*2+Math.random()*(W-s*4),
      y:-s*3, s,
      vy:0.6+Math.random()*1.3,
      wobble:Math.random()*Math.PI*2,
      ws:0.02+Math.random()*0.025,
      hue:186+Math.random()*36,
      alpha:1,
      caught:false,ct:0
    });
  }

  function drawHeart(x,y,s,alpha,hue){
    ctx.save();
    ctx.globalAlpha=Math.max(0,alpha);
    ctx.beginPath();
    ctx.moveTo(x,y+s*0.25);
    ctx.bezierCurveTo(x,y-s*0.25,x-s,y-s*0.25,x-s,y+s*0.25);
    ctx.bezierCurveTo(x-s,y+s*0.7,x,y+s*1.05,x,y+s*1.1);
    ctx.bezierCurveTo(x,y+s*1.05,x+s,y+s*0.7,x+s,y+s*0.25);
    ctx.bezierCurveTo(x+s,y-s*0.25,x,y-s*0.25,x,y+s*0.25);
    ctx.closePath();
    const g=ctx.createRadialGradient(x,y+s*0.4,0,x,y+s*0.4,s*1.4);
    g.addColorStop(0,`hsla(${hue},65%,88%,1)`);
    g.addColorStop(1,`hsla(${hue},60%,52%,0.65)`);
    ctx.fillStyle=g;
    ctx.fill();
    ctx.strokeStyle=`hsla(${hue},55%,90%,0.35)`;
    ctx.lineWidth=0.5;
    ctx.stroke();
    ctx.restore();
  }

  function loop(){
    if(W===0){ requestAnimationFrame(loop); return; }
    ctx.clearRect(0,0,W,H);

    if(started&&!over) drawHeart(mx,my-12,8,0.45,200);

    if(started&&!over){
      spawnT++;
      if(spawnT>50){ spawnT=0; if(Math.random()<0.9) spawn(); }
      msgT++;
      if(msgT>200){
        msgT=0;
        document.getElementById('hint').textContent=msgs[Math.floor(Math.random()*msgs.length)];
      }
    }

    for(let i=hearts.length-1;i>=0;i--){
      const h=hearts[i];
      if(h.caught){
        h.ct+=0.09; h.alpha=1-h.ct;
        h.y-=2; h.s+=0.8;
        if(h.alpha<=0){ hearts.splice(i,1); continue; }
      } else {
        h.wobble+=h.ws;
        h.y+=h.vy;
        h.x+=Math.sin(h.wobble)*0.65;
        if(h.y>H+30){ hearts.splice(i,1); continue; }
        const dx=mx-h.x, dy=my-(h.y+h.s*0.5);
        if(Math.sqrt(dx*dx+dy*dy)<h.s*1.7+14){
          h.caught=true;
          score++;
          document.getElementById('sc').textContent=score;
        }
      }
      drawHeart(h.x,h.y,h.s,h.alpha,h.hue);
    }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
